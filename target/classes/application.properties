spring.application.name=help-desk

# Configuracao SMTP (Mailtrap - sandbox de testes, nao envia e-mail de verdade).
# Os valores depois de ":" sao defaults, usados quando as variaveis de ambiente
# MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD nao estao definidas.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
# 2525 e a porta recomendada pelo Mailtrap - evita bloqueio em redes/provedores
# que restringem as portas SMTP tradicionais (25/465/587).
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:738df76fbed1df}
spring.mail.password=${MAIL_PASSWORD:bcbec069897501}
# Exige autenticacao e criptografia (TLS) na conexao com o servidor SMTP.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
