spring.application.name=help-desk

# Configuracao SMTP (Mailtrap - sandbox de testes, nao envia e-mail de verdade).
# Todas exigem a variável de ambiente correspondente definida no .env - sem
# default: se faltar alguma, a aplicação não sobe.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Exige autenticação e criptografia (TLS) na conexão com o servidor SMTP.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Credenciais do MySQL - exigem as variáveis de ambiente DATASOURCE_URL,
# DATASOURCE_USERNAME e DATASOURCE_PASSWORD definidas (sem valor default:
# se faltar alguma, a aplicação não sobe).
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
